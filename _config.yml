# Site settings
title: Zhiyi's Personal Website
email: zhiyi@cs.ucla.edu
description: >-
  Personal Website of Zhiyi Zhang, Research Scientist @ Meta (Privacy Enhancing Technologies). Ph.D. Computer Science, UCLA 2021 — network security, privacy, and Named Data Networking (NDN).
baseurl: ""
url: "https://zhiyi-zhang.com"

# Author / SEO defaults (used by jekyll-seo-tag)
author: Zhiyi Zhang
twitter:
  username:
lang: en
timezone: America/Los_Angeles

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Sitemap / SEO
defaults:
  - scope:
      path: ""
    values:
      image: /images/headpic.jpg

# Exclude from processing / publishing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata
  - vendor
  - tmp
  - "*.gemspec"
  - README.md
  - CONTEXT.md
  - AUDIT_REPORT.md
  - _experiments
  - Gemfile.lock

# Keep CNAME for custom domain
include:
  - CNAME
